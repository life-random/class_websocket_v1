server:
  servlet:
    session:
      tracking-modes: cookie    # 세션 번호를 쿠키로만 전달 (주소에 ;jsessionid 를 붙이지 않음)

spring:
  application:
    name: class_websocket_v1

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test
    username: sa

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

  # 머스태치 기본 위치 : src/main/resources/templates/ xxxx.mustache(기본값)